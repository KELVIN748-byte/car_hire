<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login - Car Hire Management System</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <h1>Online Admin</h1>
    <p>Authorized Staff Portal Login</p>
    
    <form action="dashboard.html" method="GET">
      <div class="form-group">
        <label for="username">Username or Staff ID</label>
        <input type="text" id="username" name="username" placeholder="Enter staff username" required>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>
      </div>
      
      <button type="submit" class="btn" style="width: 100%; justify-content: center; margin-top: 0.5rem;">Login to Dashboard</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem;">
      <a href="index.html" style="color: var(--text-light); font-size: 0.9rem; text-decoration: none; transition: var(--transition);">&larr; Return to Home / Landing Page</a>
    </div>
  </div>
</body>
</html>
